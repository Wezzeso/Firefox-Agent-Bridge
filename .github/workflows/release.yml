name: Release
on:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag and source version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/build.py
      - name: Verify the packaged installer with real Firefox
        env:
          FIREFOX_AGENT_LIVE_TEST: '1'
        run: |
          curl --fail --location --retry 3 'https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US' --output /tmp/firefox.tar.xz
          mkdir -p "$RUNNER_TEMP/firefox-bin"
          tar -xf /tmp/firefox.tar.xz -C "$RUNNER_TEMP/firefox-bin"
          FIREFOX_BINARY="$RUNNER_TEMP/firefox-bin/firefox/firefox" FIREFOX_AGENT_RELEASE_ARCHIVE="$PWD/dist/firefox-agent-bridge-$(cat VERSION).tar.gz" python -m unittest discover -s tests -p test_live_install.py -v
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(cat VERSION)" dist/* --target "$GITHUB_SHA" --generate-notes --title "Firefox Agent Bridge v$(cat VERSION)"
